[package]
name = "omibot"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "runtime-tokio", "json"] }
log = "0.4.33"
serde = "1.0.228"
moka = { version = "0.12.15", features = ["future"] }
serde_json = "1.0.150"
rquickjs = { version = "0.12.1", features = ["macro", "classes"] }
env_logger = "0.11.11"