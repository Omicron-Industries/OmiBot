[package]
name = "bunny_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "runtime-tokio"] }
log = "0.4.33"
serde = "1.0.228"
moka = { version = "0.12.15", features = ["future"] }