services:
  postgres:
    image: postgres:18
    networks:
      - omibot_network
    restart: unless-stopped
    env_file: ".env"
    volumes:
      - ./postgresql:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
  omibot:
    image: ghcr.io/omicron-industries/omibot:latest
    networks:
      - omibot_network
    depends_on:
      - postgres
    restart: unless-stopped
    env_file: ".env"
    environment:
      RUST_LOG: debug
    volumes:
      - ./logs/:/app/logs/

networks:
  omibot_network:
    driver: bridge
